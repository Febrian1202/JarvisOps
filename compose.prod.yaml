services:
  mysql:
    image: mysql:8.4
    container_name: jarvisops-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret_root_prod}
      MYSQL_DATABASE: ${DB_DATABASE:-JarvisOps}
      MYSQL_USER: ${DB_USERNAME:-jarvisops}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_prod}
    volumes:
      - mysql-data-prod:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret_root_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/febrian1202}/jarvisops-api:${APP_VERSION:-latest}
    container_name: jarvisops-prod-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production
    environment:
      SERVER_NAME: "http://:8000"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-JarvisOps}
      DB_USERNAME: ${DB_USERNAME:-jarvisops}
      DB_PASSWORD: ${DB_PASSWORD:-secret_prod}
    ports:
      - "8000:8000"
    volumes:
      - app-storage:/app/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  scheduler:
    image: ${IMAGE_REGISTRY:-ghcr.io/febrian1202}/jarvisops-api:${APP_VERSION:-latest}
    container_name: jarvisops-prod-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - ./apps/api/.env.production
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-JarvisOps}
      DB_USERNAME: ${DB_USERNAME:-jarvisops}
      DB_PASSWORD: ${DB_PASSWORD:-secret_prod}
    volumes:
      - app-storage:/app/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/febrian1202}/jarvisops-web:${APP_VERSION:-latest}
    container_name: jarvisops-prod-web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env.production
    environment:
      PORT: 3000
      API_BASE_URL: http://api:8000/api
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mysql-data-prod:
  app-storage:
